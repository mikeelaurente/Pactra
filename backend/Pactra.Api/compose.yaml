services:
  api:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PactraDatabase: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.30.10.10
      backend:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles:
      - tools
    working_dir: /src
    volumes:
      - .:/src
    environment:
      ConnectionStrings__PactraDatabase: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        dotnet tool install --global dotnet-ef --version 10.0.12
        export PATH="$$PATH:/root/.dotnet/tools"
        dotnet restore Pactra.Api.csproj
        dotnet ef database update
    networks:
      - backend


  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      proxy:
        ipv4_address: 172.30.10.2

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  
networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24

  backend:
    driver: bridge
    internal: true